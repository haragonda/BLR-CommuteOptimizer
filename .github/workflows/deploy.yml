# BLR-CommuteOptimizer v2 — GitHub Actions CI/CD
# Repository: github.com/haragonda/BLR-CommuteOptimizer
#
# Required GitHub Secrets:
#   VERCEL_TOKEN          — vercel.com → Account Settings → Tokens
#   VERCEL_ORG_ID         — .vercel/project.json → orgId
#   VERCEL_PROJECT_ID     — .vercel/project.json → projectId
#   GOOGLE_MAPS_API_KEY   — Private server-side key (Directions API)
#   PUBLIC_MAPS_KEY       — Public client-side key (Places API only, referrer-restricted)

name: CI / Deploy — BLR-CommuteOptimizer v2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────
  quality-check:
  # ─────────────────────────────────────
    name: Lint, Structure & Security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then npm ci --prefer-offline
          else npm install -g eslint@latest; fi

      - name: Verify required files
        run: |
          echo "── Required file structure check ──"
          FILES=(
            "index.html" "app.js" "sw.js" "manifest.json"
            "holidays.js" "history.js" "analytics.js"
            "api/commute.js" ".gitignore" "README.md"
          )
          MISSING=0
          for f in "${FILES[@]}"; do
            if [ -f "$f" ]; then echo "  ✓  $f"
            else echo "  ✗  MISSING: $f"; MISSING=$((MISSING+1)); fi
          done
          [ $MISSING -gt 0 ] && echo "ERROR: $MISSING file(s) missing." && exit 1
          echo "All required files present."

      - name: Lint JavaScript
        run: |
          cat > .eslintrc.json << 'EOF'
          {
            "env": { "browser": true, "es2022": true, "node": true },
            "parserOptions": { "ecmaVersion": 2022, "sourceType": "module" },
            "rules": {
              "no-undef": "error", "no-var": "error",
              "semi": ["error", "always"], "eqeqeq": ["error", "always"]
            }
          }
          EOF
          for f in app.js holidays.js history.js analytics.js api/commute.js sw.js; do
            echo "── Linting $f ──"
            npx eslint "$f" --max-warnings=15 || true
          done

      - name: Check for committed secrets
        run: |
          echo "── Secrets scan ──"
          PATTERNS=("AIza" "GOOGLE_MAPS_API_KEY=" "sk-" "Bearer " "PUBLIC_MAPS_KEY=A")
          FOUND=0
          for p in "${PATTERNS[@]}"; do
            R=$(grep -rn --include="*.js" --include="*.html" --include="*.json" \
              --exclude-dir=".github" --exclude="*.example" "$p" . 2>/dev/null || true)
            if [ -n "$R" ]; then
              echo "  ✗  Potential secret '$p':"; echo "$R"; FOUND=$((FOUND+1))
            fi
          done
          [ $FOUND -gt 0 ] && echo "ERROR: Remove secrets before merging." && exit 1
          echo "  ✓  No secrets found."

      - name: Check PUBLIC_MAPS_KEY placeholder
        run: |
          echo "── Verifying PUBLIC_MAPS_KEY is placeholder in HTML ──"
          if grep -q "PUBLIC_MAPS_KEY" index.html; then
            echo "  ✓  index.html contains PUBLIC_MAPS_KEY placeholder (replace at deploy time)"
          else
            echo "  ✗  PUBLIC_MAPS_KEY missing from index.html"
            exit 1
          fi

      - name: Validate A11y attributes
        run: |
          echo "── Accessibility attribute check ──"
          CHECKS=('lang="en"' 'aria-live' 'aria-label' 'role=' 'skip-nav' 'aria-busy')
          FAIL=0
          for c in "${CHECKS[@]}"; do
            if grep -q "$c" index.html; then echo "  ✓  $c"
            else echo "  ✗  MISSING: $c"; FAIL=$((FAIL+1)); fi
          done
          [ $FAIL -gt 0 ] && echo "WARNING: $FAIL A11y attribute(s) missing."

      - name: Validate Service Worker registration
        run: |
          echo "── Service Worker check ──"
          grep -q "serviceWorker" app.js && echo "  ✓  SW registration found in app.js" || echo "  ✗  SW registration missing"
          grep -q "fetch" sw.js && echo "  ✓  Fetch handler found in sw.js" || echo "  ✗  Fetch handler missing in sw.js"

  # ─────────────────────────────────────
  deploy:
  # ─────────────────────────────────────
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: quality-check
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production
      url: https://blr-commuteoptimizer.vercel.app

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Inject PUBLIC_MAPS_KEY into index.html
        run: |
          # Replaces the placeholder in index.html with the actual public key at deploy time
          # The key never sits in source code
          sed -i "s/PUBLIC_MAPS_KEY/${{ secrets.PUBLIC_MAPS_KEY }}/g" index.html
          echo "PUBLIC_MAPS_KEY injected into index.html."
        env:
          PUBLIC_MAPS_KEY: ${{ secrets.PUBLIC_MAPS_KEY }}

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "deploy_url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $URL"
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Summary
        run: |
          echo "## 🚗 BLR-CommuteOptimizer v2 Deployed" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deploy.outputs.deploy_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**By:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
